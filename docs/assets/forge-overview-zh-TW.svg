<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="ChatGPTForge product overview"><title>ChatGPTForge product overview</title><style>text{font-family:Segoe UI,Microsoft JhengHei,Microsoft YaHei,Arial,sans-serif}</style><rect x="0" y="0" width="1200" height="600" rx="0" fill="#f5f3ed" stroke="none"/><rect x="44" y="42" width="46" height="46" rx="12" fill="#245de8" stroke="none"/><path d="M 57 57 H 78 M 57 65 H 72 M 57 57 V 76" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/><text x="105" y="75" font-size="27" fill="#182335" font-weight="700">ChatGPTForge</text><text x="1148" y="70" font-size="15" fill="#687384" font-weight="600">01</text><text x="48" y="143" font-size="13" fill="#245de8" font-weight="700">對話驅動的 WINDOWS 工作環境</text><text x="46" y="215" font-size="52" fill="#182335" font-weight="700">從對話出發，</text><text x="46" y="278" font-size="52" fill="#182335" font-weight="700">讓工作真正完成。</text><text x="48" y="330" font-size="23" fill="#536172" font-weight="400">程式修改、瀏覽器與桌面操作，</text><text x="48" y="365" font-size="23" fill="#536172" font-weight="400">接上你的 ChatGPT 工作流程。</text><rect x="48" y="412" width="154" height="42" rx="21" fill="#e5ecfc" stroke="none"/><text x="69" y="440" font-size="16" fill="#245de8" font-weight="600">持續任務</text><rect x="214" y="412" width="168" height="42" rx="21" fill="#e5ecfc" stroke="none"/><text x="234" y="440" font-size="16" fill="#245de8" font-weight="600">可回復修改</text><rect x="394" y="412" width="134" height="42" rx="21" fill="#e5ecfc" stroke="none"/><text x="415" y="440" font-size="16" fill="#245de8" font-weight="600">本機工具</text><rect x="650" y="130" width="500" height="348" rx="24" fill="#fff" stroke="#dce1e7"/><text x="676" y="167" font-size="12" fill="#7c8796" font-weight="700">工作流程示意</text><rect x="676" y="191" width="446" height="64" rx="12" fill="#f5f7fb" stroke="none"/><text x="695" y="219" font-size="12" fill="#687384" font-weight="700">你提出需求</text><text x="695" y="243" font-size="17" fill="#182335" font-weight="600">「預覽修改，再執行相關驗證。」</text><path d="M 899 256 L 899 282" fill="none" stroke="#245de8" stroke-width="2" /><path d="M 893 275 L 899 282 L 905 275" fill="none" stroke="#245de8" stroke-width="2"/><rect x="676" y="296" width="143" height="70" rx="12" fill="#fff" stroke="#dce1e7"/><text x="692" y="321" font-size="12" fill="#245de8" font-weight="700">01</text><text x="692" y="349" font-size="21" fill="#182335" font-weight="600">程式碼</text><rect x="827" y="296" width="143" height="70" rx="12" fill="#fff" stroke="#dce1e7"/><text x="843" y="321" font-size="12" fill="#245de8" font-weight="700">02</text><text x="843" y="349" font-size="21" fill="#182335" font-weight="600">瀏覽器</text><rect x="978" y="296" width="143" height="70" rx="12" fill="#fff" stroke="#dce1e7"/><text x="994" y="321" font-size="12" fill="#245de8" font-weight="700">03</text><text x="994" y="349" font-size="21" fill="#182335" font-weight="600">Windows</text><rect x="676" y="389" width="446" height="60" rx="12" fill="#e9f5ef" stroke="none"/><text x="697" y="414" font-size="17" fill="#23634a" font-weight="600">檢查結果，再決定下一步。</text><text x="697" y="436" font-size="13" fill="#507763" font-weight="400">保留任務狀態與操作回執</text><path d="M 48 521 L 1152 521" fill="none" stroke="#d8dce1" stroke-width="2" /><text x="48" y="559" font-size="15" fill="#687384" font-weight="400">Windows · 開發者預覽版 · MIT</text><text x="1010" y="559" font-size="17" fill="#182335" font-weight="600">Fluxenith</text></svg>