<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="대화로 코드, 브라우저, Windows 도구 연결"><title>대화로 코드, 브라우저, Windows 도구 연결</title><style>text{font-family:Segoe UI,Microsoft JhengHei,Microsoft YaHei,Arial,sans-serif}</style><rect x="0" y="0" width="1200" height="430" rx="0" fill="#f5f3ed" stroke="none"/><text x="44" y="60" font-size="32" fill="#182335" font-weight="700">단계마다 확인할 수 있습니다.</text><text x="44" y="98" font-size="18" fill="#687384" font-weight="400">현재 상태와 변경을 확인한 뒤 실행하고 검증하세요.</text><rect x="44" y="137" width="266" height="142" rx="16" fill="#fff" stroke="#dce1e7"/><text x="64" y="168" font-size="13" fill="#245de8" font-weight="700">01</text><text x="64" y="209" font-size="28" fill="#182335" font-weight="600">살펴보기</text><text x="64" y="248" font-size="15" fill="#687384" font-weight="400">현재 상태 확인</text><path d="M 311 207 L 324 207" fill="none" stroke="#245de8" stroke-width="2" /><rect x="326" y="137" width="266" height="142" rx="16" fill="#fff" stroke="#dce1e7"/><text x="346" y="168" font-size="13" fill="#245de8" font-weight="700">02</text><text x="346" y="209" font-size="28" fill="#182335" font-weight="600">미리 보기</text><text x="346" y="248" font-size="15" fill="#687384" font-weight="400">여러 파일의 변경 검토</text><path d="M 593 207 L 606 207" fill="none" stroke="#245de8" stroke-width="2" /><rect x="608" y="137" width="266" height="142" rx="16" fill="#fff" stroke="#dce1e7"/><text x="628" y="168" font-size="13" fill="#245de8" font-weight="700">03</text><text x="628" y="209" font-size="28" fill="#182335" font-weight="600">실행</text><text x="628" y="248" font-size="15" fill="#687384" font-weight="400">승인한 로컬 도구 사용</text><path d="M 875 207 L 888 207" fill="none" stroke="#245de8" stroke-width="2" /><rect x="890" y="137" width="266" height="142" rx="16" fill="#e9f5ef" stroke="#dce1e7"/><text x="910" y="168" font-size="13" fill="#245de8" font-weight="700">04</text><text x="910" y="209" font-size="28" fill="#182335" font-weight="600">검증</text><text x="910" y="248" font-size="15" fill="#687384" font-weight="400">검사 실행 및 결과 확인</text><path d="M 1020 280 L 1020 318" fill="none" stroke="#8792a2" stroke-width="2" stroke-dasharray="5 5"/><path d="M 1020 318 L 300 318" fill="none" stroke="#8792a2" stroke-width="2" stroke-dasharray="5 5"/><text x="44" y="357" font-size="18" fill="#182335" font-weight="600">되돌려야 하나요? 실행 기록을 확인하고 지원되는 편집을 복구하세요.</text><text x="44" y="393" font-size="14" fill="#687384" font-weight="400">복구 가능 여부는 작업에 따라 다릅니다. 외부 웹사이트, 셸, 데스크톱 작업은 되돌릴 수 없을 수 있습니다.</text></svg>