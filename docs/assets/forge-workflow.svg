<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="ChatGPTForge inspect preview act verify workflow"><title>ChatGPTForge inspect preview act verify workflow</title><style>text{font-family:Segoe UI,Microsoft JhengHei,Microsoft YaHei,Arial,sans-serif}</style><rect x="0" y="0" width="1200" height="430" rx="0" fill="#f5f3ed" stroke="none"/><text x="44" y="60" font-size="32" fill="#182335" font-weight="700">A workflow you can inspect.</text><text x="44" y="98" font-size="18" fill="#687384" font-weight="400">Understand and preview before you act. Verify after.</text><rect x="44" y="137" width="266" height="142" rx="16" fill="#fff" stroke="#dce1e7"/><text x="64" y="168" font-size="13" fill="#245de8" font-weight="700">01</text><text x="64" y="209" font-size="28" fill="#182335" font-weight="600">Inspect</text><text x="64" y="248" font-size="16" fill="#687384" font-weight="400">Read the current state</text><path d="M 311 207 L 324 207" fill="none" stroke="#245de8" stroke-width="2" /><rect x="326" y="137" width="266" height="142" rx="16" fill="#fff" stroke="#dce1e7"/><text x="346" y="168" font-size="13" fill="#245de8" font-weight="700">02</text><text x="346" y="209" font-size="28" fill="#182335" font-weight="600">Preview</text><text x="346" y="248" font-size="16" fill="#687384" font-weight="400">Review cross-file edits</text><path d="M 593 207 L 606 207" fill="none" stroke="#245de8" stroke-width="2" /><rect x="608" y="137" width="266" height="142" rx="16" fill="#fff" stroke="#dce1e7"/><text x="628" y="168" font-size="13" fill="#245de8" font-weight="700">03</text><text x="628" y="209" font-size="28" fill="#182335" font-weight="600">Act</text><text x="628" y="248" font-size="16" fill="#687384" font-weight="400">Use approved local tools</text><path d="M 875 207 L 888 207" fill="none" stroke="#245de8" stroke-width="2" /><rect x="890" y="137" width="266" height="142" rx="16" fill="#e9f5ef" stroke="#dce1e7"/><text x="910" y="168" font-size="13" fill="#245de8" font-weight="700">04</text><text x="910" y="209" font-size="28" fill="#182335" font-weight="600">Verify</text><text x="910" y="248" font-size="16" fill="#687384" font-weight="400">Run checks, inspect results</text><path d="M 1020 280 L 1020 318" fill="none" stroke="#8792a2" stroke-width="2" stroke-dasharray="5 5"/><path d="M 1020 318 L 300 318" fill="none" stroke="#8792a2" stroke-width="2" stroke-dasharray="5 5"/><text x="44" y="357" font-size="20" fill="#182335" font-weight="600">Need to recover? Inspect the receipt, then roll back supported code edits.</text><text x="44" y="393" font-size="14" fill="#687384" font-weight="400">Recovery depends on the operation. External browser, shell and desktop actions may not be reversible.</text></svg>