<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="対話からコード、ブラウザー、Windows ツールを操作"><title>対話からコード、ブラウザー、Windows ツールを操作</title><style>text{font-family:Segoe UI,Microsoft JhengHei,Microsoft YaHei,Arial,sans-serif}</style><rect x="0" y="0" width="1200" height="600" rx="0" fill="#f5f3ed" stroke="none"/><rect x="44" y="42" width="46" height="46" rx="12" fill="#245de8" stroke="none"/><path d="M 57 57 H 78 M 57 65 H 72 M 57 57 V 76" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/><text x="105" y="75" font-size="27" fill="#182335" font-weight="700">ChatGPTForge</text><text x="1148" y="70" font-size="15" fill="#687384" font-weight="600">01</text><text x="48" y="143" font-size="13" fill="#245de8" font-weight="700">対話から始める WINDOWS ワークフロー</text><text x="46" y="215" font-size="49" fill="#182335" font-weight="700">対話を、</text><text x="46" y="278" font-size="49" fill="#182335" font-weight="700">実際の作業へ。</text><text x="48" y="330" font-size="23" fill="#536172" font-weight="400">コード、ブラウザー、デスクトップを</text><text x="48" y="365" font-size="23" fill="#536172" font-weight="400">ChatGPT のワークフローにつなぐ。</text><rect x="48" y="412" width="154" height="42" rx="21" fill="#e5ecfc" stroke="none"/><text x="69" y="440" font-size="15" fill="#245de8" font-weight="600">タスクを保持</text><rect x="214" y="412" width="168" height="42" rx="21" fill="#e5ecfc" stroke="none"/><text x="234" y="440" font-size="15" fill="#245de8" font-weight="600">編集を復元</text><rect x="394" y="412" width="134" height="42" rx="21" fill="#e5ecfc" stroke="none"/><text x="415" y="440" font-size="15" fill="#245de8" font-weight="600">ローカルツール</text><rect x="650" y="130" width="500" height="348" rx="24" fill="#fff" stroke="#dce1e7"/><text x="676" y="167" font-size="12" fill="#7c8796" font-weight="700">ワークフローの概念図</text><rect x="676" y="191" width="446" height="64" rx="12" fill="#f5f7fb" stroke="none"/><text x="695" y="219" font-size="12" fill="#687384" font-weight="700">作業を依頼する</text><text x="695" y="243" font-size="17" fill="#182335" font-weight="600">「変更を確認してから、チェックを実行。」</text><path d="M 899 256 L 899 282" fill="none" stroke="#245de8" stroke-width="2" /><path d="M 893 275 L 899 282 L 905 275" fill="none" stroke="#245de8" stroke-width="2"/><rect x="676" y="296" width="143" height="70" rx="12" fill="#fff" stroke="#dce1e7"/><text x="692" y="321" font-size="12" fill="#245de8" font-weight="700">01</text><text x="692" y="349" font-size="21" fill="#182335" font-weight="600">コード</text><rect x="827" y="296" width="143" height="70" rx="12" fill="#fff" stroke="#dce1e7"/><text x="843" y="321" font-size="12" fill="#245de8" font-weight="700">02</text><text x="843" y="349" font-size="21" fill="#182335" font-weight="600">ブラウザー</text><rect x="978" y="296" width="143" height="70" rx="12" fill="#fff" stroke="#dce1e7"/><text x="994" y="321" font-size="12" fill="#245de8" font-weight="700">03</text><text x="994" y="349" font-size="21" fill="#182335" font-weight="600">Windows</text><rect x="676" y="389" width="446" height="60" rx="12" fill="#e9f5ef" stroke="none"/><text x="697" y="414" font-size="17" fill="#23634a" font-weight="600">結果を確認し、次の操作を選ぶ。</text><text x="697" y="436" font-size="13" fill="#507763" font-weight="400">タスクの状態と操作記録を保持</text><path d="M 48 521 L 1152 521" fill="none" stroke="#d8dce1" stroke-width="2" /><text x="48" y="559" font-size="15" fill="#687384" font-weight="400">Windows · 開発者プレビュー · MIT</text><text x="1010" y="559" font-size="17" fill="#182335" font-weight="600">Fluxenith</text></svg>